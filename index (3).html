<script>

        // Fungsi untuk generate build per lane berdasarkan role dominan (logika sederhana tapi masuk akal)
        
function generateBuild(hero, role) {
    const builds = { EXP: [], Jungle: [], Mid: [], Gold: [], Roam: [] };
    const emblems = { EXP: '', Jungle: '', Mid: '', Gold: '', Roam: '' };

    const physicalMm = new Set(["Layla","Miya","Lesley","Wanwan","Beatrix","Brody","Claude","Granger","Moskov","Karrie","Irithel","Popol and Kupa","Natan","Melissa","Ixia","Clint","Bruno","Hanabi","Roger","Edith"]);

    const magicSkill = new Set(["Kagura","Eudora","Nana","Pharsa","Yve","Lunox","Harith","Vale","Valir","Gord","Aurora","Odette","Cecilion","Luo Yi","Xavier","Valentina","Lylia","Chang'e","Vexana","Faramis","Harley","Cyclops","Zhask","Alice","Novaria","Zhuxin","Obsidia","Zetian","Kadita","Selena","Kimmy","Julian","Esmeralda"]);

    const isMage = role.includes("Mage") || magicSkill.has(hero);
    const isSupport = !isMage && (role.includes("Support") || supportHeroes.has(hero));
    const isTank = !isMage && !isSupport && (role.includes("Tank") || tankHeroes.has(hero));
    const isMarksman = !isMage && !isSupport && !isTank && (role.includes("Marksman") || physicalMm.has(hero));
    const isAssassin = !isMage && !isSupport && !isTank && !isMarksman && (role.includes("Assassin") || physicalBurst.has(hero));
    const isPhysicalFighter = !isMage && !isSupport && !isTank && !isMarksman && !isAssassin;

    if (isMage) {
        const midMage = ["Arcane Boots","Enchanted Talisman","Genius Wand","Holy Crystal","Divine Glaive","Blood Wings"];
        const burstMage = ["Magic Shoes","Lightning Truncheon","Holy Crystal","Divine Glaive","Blood Wings","Winter Truncheon"];
        const sustainMage = ["Magic Shoes","Enchanted Talisman","Clock of Destiny","Oracle","Holy Crystal","Blood Wings"];
        const roamMage = ["Magic Shoes","Enchanted Talisman","Oracle","Athena's Shield","Radiant Armor","Immortality"];

        builds.Mid = midMage;
        builds.EXP = sustainMage;
        builds.Gold = ["Magic Shoes","Feather of Heaven","Genius Wand","Holy Crystal","Divine Glaive","Blood Wings"];
        builds.Jungle = ["Arcane Boots","Enchanted Talisman","Genius Wand","Holy Crystal","Divine Glaive","Winter Truncheon"];
        builds.Roam = roamMage;

        emblems.Mid = "Mage (Rupture, Bargain Hunter, Impure Rage)";
        emblems.EXP = "Mage (Rupture, Bargain Hunter, Impure Rage)";
        emblems.Gold = "Mage (Rupture, Bargain Hunter, Impure Rage)";
        emblems.Jungle = "Mage (Rupture, Bargain Hunter, Impure Rage)";
        emblems.Roam = "Support (Agility, Bargain Hunter, Focusing Mark)";
    } else if (isSupport) {
        const supportCore = ["Magic Shoes","Enchanted Talisman","Oracle","Athena's Shield","Radiant Armor","Immortality"];
        const supportRoam = ["Tough Boots","Dominance Ice","Oracle","Athena's Shield","Radiant Armor","Immortality"];
        const supportAggro = ["Magic Shoes","Enchanted Talisman","Ice Queen Wand","Oracle","Divine Glaive","Immortality"];

        builds.EXP = supportAggro;
        builds.Jungle = supportCore;
        builds.Mid = supportAggro;
        builds.Gold = supportAggro;
        builds.Roam = supportRoam;

        emblems.EXP = "Support (Agility, Bargain Hunter, Focusing Mark)";
        emblems.Jungle = "Tank (Vitality, Tenacity, Concussive Blast)";
        emblems.Mid = "Support (Agility, Bargain Hunter, Focusing Mark)";
        emblems.Gold = "Support (Agility, Bargain Hunter, Focusing Mark)";
        emblems.Roam = "Support (Agility, Bargain Hunter, Focusing Mark)";
    } else if (isTank) {
        const tankCore = ["Tough Boots","Dominance Ice","Athena's Shield","Radiant Armor","Antique Cuirass","Immortality"];
        const tankExp = ["Tough Boots","Cursed Helmet","Dominance Ice","Oracle","Antique Cuirass","Immortality"];
        const tankJungle = ["Tough Boots","Cursed Helmet","Dominance Ice","Oracle","Radiant Armor","Immortality"];
        const tankGold = ["Tough Boots","Dominance Ice","Oracle","Athena's Shield","Antique Cuirass","Immortality"];

        builds.EXP = tankExp;
        builds.Jungle = tankJungle;
        builds.Mid = tankCore;

        emblems.EXP = "Tank (Vitality, Tenacity, Concussive Blast)";

        emblems.Gold = "Tank (Vitality, Tenacity, Concussive Blast)";
        emblems.Roam = "Tank (Vitality, Tenacity, Concussive Blast)";
    } else if (isMarksman) {
        const atkSpeed = physicalMm.has(hero) && !["Lesley","Brody","Beatrix","Clint","Bruno"].includes(hero);
        const mmAttack = ["Swift Boots","Corrosion Scythe","Demon Hunter Sword","Golden Staff","Malefic Roar","Wind of Nature"];
        const mmCrit = ["Swift Boots","Berserker's Fury","Windtalker","Malefic Roar","Blade of Despair","Wind of Nature"];
        const mmSkill = ["Swift Boots","Endless Battle","Blade of the Heptaseas","Berserker's Fury","Malefic Roar","Immortality"];
        const mmRoam = ["Tough Boots","Dominance Ice","Antique Cuirass","Blade of Despair","Malefic Roar","Immortality"];

        const chosenGold = ["Claude","Wanwan","Miya","Moskov","Karrie","Irithel","Melissa","Hanabi","Popol and Kupa","Natan","Ixia","Edith"].includes(hero) ? mmAttack
            : ["Lesley","Brody","Beatrix","Clint","Bruno","Granger"].includes(hero) ? mmCrit
            : mmSkill;

        builds.EXP = mmSkill;
        builds.Jungle = ["Tough Boots","Hunter Strike","Blade of the Heptaseas","Malefic Roar","Blade of Despair","Immortality"];
        builds.Mid = mmSkill;
        builds.Gold = chosenGold;
        builds.Roam = mmRoam;

        emblems.EXP = "Marksman (Swift, Weapon Master, Quantum Charge)";
        emblems.Jungle = "Assassin (Rupture, Master Assassin, Killing Spree)";
        emblems.Mid = "Marksman (Swift, Weapon Master, Quantum Charge)";
        emblems.Gold = "Marksman (Swift, Weapon Master, Quantum Charge)";
        emblems.Roam = "Tank (Vitality, Tenacity, Concussive Blast)";
    } else if (isAssassin) {
        const burst = ["Tough Boots","Blade of the Heptaseas","Hunter Strike","Malefic Roar","Blade of Despair","Immortality"];
        const burstJungle = ["Tough Boots","Hunter Strike","Blade of the Heptaseas","Malefic Roar","Blade of Despair","Immortality"];
        const burstRoam = ["Tough Boots","Blade of the Heptaseas","Hunter Strike","Dominance Ice","Antique Cuirass","Immortality"];

        builds.EXP = burst;
        builds.Jungle = burstJungle;
        builds.Mid = burst;
        builds.Gold = burst;
        builds.Roam = burstRoam;

        emblems.EXP = "Assassin (Rupture, Master Assassin, Lethal Ignition)";
        emblems.Jungle = "Assassin (Rupture, Master Assassin, Lethal Ignition)";
        emblems.Mid = "Assassin (Rupture, Master Assassin, Lethal Ignition)";
        emblems.Gold = "Assassin (Rupture, Master Assassin, Lethal Ignition)";
        emblems.Roam = "Assassin (Rupture, Master Assassin, Lethal Ignition)";
    } else if (isPhysicalFighter) {
        const bruiserExp = ["Tough Boots","War Axe","Bloodlust Axe","Hunter Strike","Brute Force Breastplate","Immortality"];
        const bruiserJungle = ["Tough Boots","War Axe","Hunter Strike","Blade of the Heptaseas","Malefic Roar","Immortality"];

        const bruiserRoam = ["Tough Boots","Dominance Ice","Oracle","Antique Cuirass","Brute Force Breastplate","Immortality"];

        builds.EXP = bruiserExp;
        builds.Jungle = bruiserJungle;
        builds.Mid = bruiserMid;
        builds.Gold = bruiserGold;
        builds.Roam = bruiserRoam;

        emblems.Jungle = "Fighter (Bravery, Seasoned Hunter, Brave Smite)";
        emblems.Mid = "Fighter (Bravery, Weapon Master, Lethal Ignition)";
        emblems.Gold = "Fighter (Bravery, Weapon Master, Lethal Ignition)";
        emblems.Roam = "Tank (Vitality, Tenacity, Concussive Blast)";
    }

    // fallback safety: semua item yang muncul tetap mengikuti tipe hero
    Object.keys(builds).forEach(lane => {
        if (!Array.isArray(builds[lane]) || builds[lane].length === 0) {
            builds[lane] = ["Tough Boots","War Axe","Hunter Strike","Malefic Roar","Immortality","Brute Force Breastplate"];
            emblems[lane] = "Fighter (Bravery, Weapon Master, Brave Smite)";
        }
    });

    // hero-specific override (untuk hero yang memang butuh build khusus)
    if (typeof heroSpecificBuilds !== "undefined" && heroSpecificBuilds[hero]) {
        Object.keys(heroSpecificBuilds[hero]).forEach(lane => {
            const cfg = heroSpecificBuilds[hero][lane];
            if (cfg && cfg.items) builds[lane] = cfg.items;
            if (cfg && cfg.emblem) emblems[lane] = cfg.emblem;
        });
    }

    return { builds, emblems };
}

// Mapping role untuk setiap hero (diperlukan untuk generate)
        const roleMap = {

            "Chou":"Fighter","Yu Zhong":"Fighter","Paquito":"Fighter","Thamuz":"Fighter","X.Borg":"Fighter","Dyrroth":"Fighter",

        // Bangun data rows: 5 lane per hero
        const lanes = ["EXP","Jungle","Mid","Gold","Roam"];
        const allRows = [];

        heroes.forEach(hero => {
            const role = roleMap[hero] || "Fighter"; // default
            const { builds, emblems } = generateBuild(hero, role);
            lanes.forEach(lane => {
                const override = heroSpecificBuilds[hero] && heroSpecificBuilds[hero][lane];
                allRows.push({
                    hero: hero,
                    role: role,
                    lane: lane,
                    items: override ? override.items : builds[lane],
                    emblem: override ? override.emblem : emblems[lane]
                });
            });
        });


        // DOM
        const tbody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');
        const laneBtns = document.querySelectorAll('.lane-btn[data-lane]');
        const resultSpan = document.getElementById('resultCount');

        let activeLane = 'all';
        let searchTerm = '';

        function renderTable() {
            let filtered = allRows.filter(row => {
                if (activeLane !== 'all' && row.lane !== activeLane) return false;
                if (searchTerm.trim() !== '') {
                    const term = searchTerm.trim().toLowerCase();
                    return row.hero.toLowerCase().includes(term);
                }
                return true;
            });

            // Urutkan: hero A-Z, lalu lane
            filtered.sort((a,b) => {
                if (a.hero !== b.hero) return a.hero.localeCompare(b.hero);
                const laneOrder = {EXP:1, Jungle:2, Mid:3, Gold:4, Roam:5};
                return laneOrder[a.lane] - laneOrder[b.lane];
            });

            const uniqueHeroes = new Set(filtered.map(r => r.hero)).size;
            resultSpan.innerHTML = `Menampilkan ${filtered.length} build (${uniqueHeroes} hero)`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:32px; color:#a0b9d0;">⚠️ Hero tidak ditemukan.</td></tr>`;
                return;
            }

            let html = '';
            const laneColors = {
                EXP: '#ef4444', Jungle: '#10b981', Mid: '#8b5cf6', Gold: '#f59e0b', Roam: '#06b6d4'
            };

            filtered.forEach(row => {
                const initial = row.hero.charAt(0).toUpperCase();
                const itemsHtml = (row.items || []).map(it => `<span class="item-badge">${it}</span>`).join('');
                const laneColor = laneColors[row.lane] || '#888';
                html += `<tr>
                    <td><div class="hero-name-cell"><span class="hero-icon">${initial}</span>${row.hero}</div></td>
                    <td><span class="role-tag">${row.role}</span></td>
                    <td><span class="lane-badge" style="background:${laneColor}20; color:${laneColor}; border-left:3px solid ${laneColor};">${row.lane}</span></td>
                    <td><div class="item-list">${itemsHtml}</div></td>
                    <td><div class="emblem-cell"><span class="emblem-main">${row.emblem}</span></div></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function setActiveLane(lane) {
            activeLane = lane;
            laneBtns.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lane') === lane);
            });
            renderTable();
        }

        laneBtns.forEach(btn => btn.addEventListener('click', () => {
            setActiveLane(btn.getAttribute('data-lane'));
        }));

        searchBtn.addEventListener('click', () => {
            searchTerm = searchInput.value;
            renderTable();
        });
        searchInput.addEventListener('keyup', e => { if(e.key==='Enter') { searchTerm=searchInput.value; renderTable(); } });
        resetBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchTerm = '';
            setActiveLane('all');
        });

        renderTable();
    })();
</script>
